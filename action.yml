name: diffbrief
description: >
  Sticky pull-request comment with configurable structural diffs (Maven
  reactor graph, OpenAPI via oasdiff, AsyncAPI, migrations, i18n, lockfiles,
  SARIF, Playwright media, or custom command producers).
author: Koivisto Capital Oy

inputs:
  config:
    description: Path to the consumer JSON config (relative to the head checkout).
    required: false
    default: .github/diffbrief.json
  token:
    description: Token used to create or update the sticky pull-request comment.
    required: true
  base-sha:
    description: Base branch tip SHA (defaults to github.event.pull_request.base.sha).
    required: false
  head-sha:
    description: Pull request head SHA (defaults to github.event.pull_request.head.sha).
    required: false
  pr-number:
    description: Pull request number (defaults to github.event.pull_request.number).
    required: false
  repository:
    description: owner/name (defaults to github.repository).
    required: false
  out-dir:
    description: Directory for report artifacts under the workspace.
    required: false
    default: diffbrief-out
  upload-artifact:
    description: Upload the out-dir as a workflow artifact.
    required: false
    default: 'true'
  cache-specs:
    description: >
      Cache collected OpenAPI specs by git SHA (head + merge-base). Set true, or
      enable openapi.cacheSpecs in the JSON config.
    required: false
    default: 'false'
  head-specs-dir:
    description: >
      Pre-populated head OpenAPI specs directory (from a prior CI job artifact).
      When it already contains openapi.yaml files, the head Maven compile is skipped.
    required: false
    default: ''
  base-specs-dir:
    description: Pre-populated base OpenAPI specs directory (same idea as head-specs-dir).
    required: false
    default: ''
  reuse-head-artifact:
    description: >
      Name of a workflow artifact to download into the head specs dir before building
      (cross-run reuse via gh api). Empty skips download.
    required: false
    default: ''
  reuse-base-artifact:
    description: Artifact name to download into the base specs dir (keyed by merge-base branch tip optional).
    required: false
    default: ''
  reuse-playwright-artifact:
    description: >
      Artifact name whose contents are unpacked into the first Playwright results
      directory (default test-results) before packaging videos/traces.
    required: false
    default: ''

outputs:
  relevant:
    description: Whether any configured relevant path changed.
    value: ${{ steps.scope.outputs.relevant }}
  breaking:
    description: Whether a producer reported a breaking change.
    value: ${{ steps.publish.outputs.breaking }}
  merge-base:
    description: Merge-base SHA used for the comparison.
    value: ${{ steps.checkout-base.outputs.merge-base }}

runs:
  using: composite
  steps:
    - name: Resolve SHAs and paths
      id: meta
      shell: bash
      env:
        INPUT_BASE_SHA: ${{ inputs.base-sha }}
        INPUT_HEAD_SHA: ${{ inputs.head-sha }}
        INPUT_PR: ${{ inputs.pr-number }}
        INPUT_REPO: ${{ inputs.repository }}
        INPUT_OUT: ${{ inputs.out-dir }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_HEAD_SPECS: ${{ inputs.head-specs-dir }}
        INPUT_BASE_SPECS: ${{ inputs.base-specs-dir }}
      run: |
        out="${INPUT_OUT}"
        echo "base-sha=${INPUT_BASE_SHA:-${{ github.event.pull_request.base.sha }}}" >> "$GITHUB_OUTPUT"
        echo "head-sha=${INPUT_HEAD_SHA:-${{ github.event.pull_request.head.sha }}}" >> "$GITHUB_OUTPUT"
        echo "pr=${INPUT_PR:-${{ github.event.pull_request.number }}}" >> "$GITHUB_OUTPUT"
        echo "repo=${INPUT_REPO:-${{ github.repository }}}" >> "$GITHUB_OUTPUT"
        echo "out=${out}" >> "$GITHUB_OUTPUT"
        echo "config=${INPUT_CONFIG}" >> "$GITHUB_OUTPUT"
        echo "base-dir=${RUNNER_TEMP}/diffbrief-base" >> "$GITHUB_OUTPUT"
        if [[ -n "${INPUT_HEAD_SPECS}" ]]; then
          echo "head-specs=${INPUT_HEAD_SPECS}" >> "$GITHUB_OUTPUT"
        else
          echo "head-specs=${GITHUB_WORKSPACE}/${out}/head-specs" >> "$GITHUB_OUTPUT"
        fi
        if [[ -n "${INPUT_BASE_SPECS}" ]]; then
          echo "base-specs=${INPUT_BASE_SPECS}" >> "$GITHUB_OUTPUT"
        else
          echo "base-specs=${GITHUB_WORKSPACE}/${out}/base-specs" >> "$GITHUB_OUTPUT"
        fi

    - name: Classify changed paths
      id: scope
      shell: bash
      env:
        BASE_SHA: ${{ steps.meta.outputs.base-sha }}
        HEAD_SHA: ${{ steps.meta.outputs.head-sha }}
        DIFFBRIEF_CONFIG: ${{ github.workspace }}/${{ steps.meta.outputs.config }}
      run: node "${{ github.action_path }}/scripts/classify.mjs" >> "$GITHUB_OUTPUT"

    - name: Read producer settings
      id: producers
      shell: bash
      env:
        DIFFBRIEF_CONFIG: ${{ github.workspace }}/${{ steps.meta.outputs.config }}
        DIFFBRIEF_STATE_DIR: ${{ runner.temp }}/diffbrief-state
      run: node "${{ github.action_path }}/scripts/prepare-openapi.mjs" >> "$GITHUB_OUTPUT"

    - name: Check out the merge base
      id: checkout-base
      if: ${{ steps.scope.outputs.relevant == 'true' }}
      shell: bash
      env:
        BASE_SHA: ${{ steps.meta.outputs.base-sha }}
        HEAD_SHA: ${{ steps.meta.outputs.head-sha }}
        BASE_DIR: ${{ steps.meta.outputs.base-dir }}
      run: bash "${{ github.action_path }}/scripts/checkout-base.sh"

    - name: Plan OpenAPI reuse
      id: reuse
      if: ${{ steps.scope.outputs.relevant == 'true' && steps.producers.outputs.openapi == 'true' }}
      shell: bash
      env:
        BASE_SHA: ${{ steps.meta.outputs.base-sha }}
        HEAD_SHA: ${{ steps.meta.outputs.head-sha }}
        DIFFBRIEF_CONFIG: ${{ github.workspace }}/${{ steps.meta.outputs.config }}
        OUT_DIR: ${{ github.workspace }}/${{ steps.meta.outputs.out }}
        HEAD_SPECS: ${{ steps.meta.outputs.head-specs }}
        BASE_SPECS: ${{ steps.meta.outputs.base-specs }}
        DIFFBRIEF_CACHE_SPECS: ${{ inputs.cache-specs }}
      run: node "${{ github.action_path }}/scripts/prepare-reuse.mjs" >> "$GITHUB_OUTPUT"

    - name: Download reused head OpenAPI artifact
      if: ${{ steps.scope.outputs.relevant == 'true' && steps.producers.outputs.openapi == 'true' && inputs.reuse-head-artifact != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ steps.meta.outputs.repo }}
        EXPECTED_SHA: ${{ steps.meta.outputs.head-sha }}
        ARTIFACT_NAME: ${{ inputs.reuse-head-artifact }}
        DEST: ${{ steps.meta.outputs.head-specs }}
      run: bash "${{ github.action_path }}/scripts/download-workflow-artifact.sh"

    - name: Download reused base OpenAPI artifact
      if: ${{ steps.scope.outputs.relevant == 'true' && steps.producers.outputs.openapi == 'true' && inputs.reuse-base-artifact != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ steps.meta.outputs.repo }}
        EXPECTED_SHA: ${{ steps.checkout-base.outputs.merge-base }}
        ARTIFACT_NAME: ${{ inputs.reuse-base-artifact }}
        DEST: ${{ steps.meta.outputs.base-specs }}
      run: bash "${{ github.action_path }}/scripts/download-workflow-artifact.sh"

    - name: Download Playwright results artifact
      if: ${{ steps.scope.outputs.relevant == 'true' && inputs.reuse-playwright-artifact != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ steps.meta.outputs.repo }}
        EXPECTED_SHA: ${{ steps.meta.outputs.head-sha }}
        ARTIFACT_NAME: ${{ inputs.reuse-playwright-artifact }}
        DEST: ${{ github.workspace }}/test-results
      run: bash "${{ github.action_path }}/scripts/download-workflow-artifact.sh"

    - name: Restore cached head OpenAPI specs
      id: cache-head
      if: ${{ steps.scope.outputs.relevant == 'true' && steps.producers.outputs.openapi == 'true' && (steps.reuse.outputs.cache-specs == 'true' || inputs.cache-specs == 'true') }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.meta.outputs.head-specs }}
        key: ${{ steps.reuse.outputs.head-cache-key }}

    - name: Restore cached base OpenAPI specs
      id: cache-base
      if: ${{ steps.scope.outputs.relevant == 'true' && steps.producers.outputs.openapi == 'true' && (steps.reuse.outputs.cache-specs == 'true' || inputs.cache-specs == 'true') }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.meta.outputs.base-specs }}
        key: ${{ steps.reuse.outputs.base-cache-key }}

    - name: Re-check OpenAPI reuse after cache/download
      id: reuse2
      if: ${{ steps.scope.outputs.relevant == 'true' && steps.producers.outputs.openapi == 'true' }}
      shell: bash
      env:
        BASE_SHA: ${{ steps.meta.outputs.base-sha }}
        HEAD_SHA: ${{ steps.meta.outputs.head-sha }}
        DIFFBRIEF_CONFIG: ${{ github.workspace }}/${{ steps.meta.outputs.config }}
        OUT_DIR: ${{ github.workspace }}/${{ steps.meta.outputs.out }}
        HEAD_SPECS: ${{ steps.meta.outputs.head-specs }}
        BASE_SPECS: ${{ steps.meta.outputs.base-specs }}
        DIFFBRIEF_CACHE_SPECS: ${{ inputs.cache-specs }}
      run: node "${{ github.action_path }}/scripts/prepare-reuse.mjs" >> "$GITHUB_OUTPUT"

    - name: Install oasdiff
      if: ${{ steps.scope.outputs.relevant == 'true' && steps.producers.outputs.openapi == 'true' }}
      shell: bash
      env:
        OASDIFF_VERSION: ${{ steps.producers.outputs.oasdiff-version }}
        OASDIFF_SHA256: ${{ steps.producers.outputs.oasdiff-sha256 }}
        OASDIFF_INSTALL_DIR: ${{ runner.temp }}/oasdiff-bin
      run: bash "${{ github.action_path }}/scripts/install-oasdiff.sh"

    - name: Build head OpenAPI specs
      if: ${{ steps.scope.outputs.relevant == 'true' && steps.producers.outputs.openapi == 'true' && steps.reuse2.outputs.skip-head-build != 'true' }}
      shell: bash
      env:
        CHECKOUT: ${{ github.workspace }}
        SPECS_OUT: ${{ steps.meta.outputs.head-specs }}
        DISCOVER: ${{ steps.producers.outputs.discover }}
        SPECS_GLOB: ${{ steps.producers.outputs.specs-glob }}
        SKIP_BUILD: ${{ steps.producers.outputs.skip-build }}
        BUILD_COMMAND_FILE: ${{ steps.producers.outputs.build-command-file }}
        SPECS_LIST_FILE: ${{ steps.producers.outputs.specs-list-file }}
      run: bash "${{ github.action_path }}/scripts/build-specs.sh"

    - name: Build base OpenAPI specs
      id: build-base
      if: ${{ steps.scope.outputs.relevant == 'true' && steps.producers.outputs.openapi == 'true' && steps.reuse2.outputs.skip-base-build != 'true' }}
      continue-on-error: true
      shell: bash
      env:
        CHECKOUT: ${{ steps.meta.outputs.base-dir }}
        SPECS_OUT: ${{ steps.meta.outputs.base-specs }}
        DISCOVER: ${{ steps.producers.outputs.discover }}
        SPECS_GLOB: ${{ steps.producers.outputs.specs-glob }}
        SKIP_BUILD: ${{ steps.producers.outputs.skip-build }}
        BUILD_COMMAND_FILE: ${{ steps.producers.outputs.build-command-file }}
        SPECS_LIST_FILE: ${{ steps.producers.outputs.specs-list-file }}
      run: bash "${{ github.action_path }}/scripts/build-specs.sh"

    - name: Save cached head OpenAPI specs
      if: ${{ steps.scope.outputs.relevant == 'true' && steps.producers.outputs.openapi == 'true' && (steps.reuse.outputs.cache-specs == 'true' || inputs.cache-specs == 'true') && steps.reuse2.outputs.skip-head-build != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.meta.outputs.head-specs }}
        key: ${{ steps.reuse.outputs.head-cache-key }}

    - name: Save cached base OpenAPI specs
      if: ${{ always() && steps.scope.outputs.relevant == 'true' && steps.producers.outputs.openapi == 'true' && (steps.reuse.outputs.cache-specs == 'true' || inputs.cache-specs == 'true') && steps.reuse2.outputs.skip-base-build != 'true' && steps.build-base.outcome == 'success' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.meta.outputs.base-specs }}
        key: ${{ steps.reuse.outputs.base-cache-key }}

    - name: Publish the review comment
      id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BASE_DIR: ${{ steps.meta.outputs.base-dir }}
        HEAD_DIR: ${{ github.workspace }}
        BASE_SPECS: ${{ steps.meta.outputs.base-specs }}
        HEAD_SPECS: ${{ steps.meta.outputs.head-specs }}
        OUT_DIR: ${{ github.workspace }}/${{ steps.meta.outputs.out }}
        PR_NUMBER: ${{ steps.meta.outputs.pr }}
        REPO: ${{ steps.meta.outputs.repo }}
        RELEVANT: ${{ steps.scope.outputs.relevant }}
        BASE_BUILD_OUTCOME: ${{ steps.build-base.outcome }}
        OASDIFF_BIN: ${{ runner.temp }}/oasdiff-bin/oasdiff
        DIFFBRIEF_CONFIG: ${{ github.workspace }}/${{ steps.meta.outputs.config }}
      run: node "${{ github.action_path }}/scripts/run.mjs"

    - name: Upload diffbrief output
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.producers.outputs.artifact }}
        path: ${{ steps.meta.outputs.out }}/
        if-no-files-found: ignore

    - name: Fail on breaking changes
      if: ${{ always() }}
      shell: bash
      env:
        OUT_DIR: ${{ github.workspace }}/${{ steps.meta.outputs.out }}
      run: node "${{ github.action_path }}/scripts/check-breaking.mjs"
